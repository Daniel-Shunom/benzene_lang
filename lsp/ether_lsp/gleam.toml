name = "ether_lsp"
version = "0.1.0"
description = "Language server for Benzene. Not published; built from this repository."
licences = ["MIT"]

# gleam_erlang is pulled in by gleam_json; the server's own Erlang interop
# lives in src/ether_lsp_ffi.erl rather than going through it.
[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
