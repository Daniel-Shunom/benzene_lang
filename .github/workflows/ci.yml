name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake

      - name: Build and test
        env:
          CXX: g++-14
          CC: gcc-14
        run: bash ./test.sh

  # The language server is a separate toolchain from the compiler, so it gets
  # its own job rather than slowing the C++ one down.
  lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.0"

      - name: Unit-test the language server
        working-directory: lsp/ether_lsp
        run: gleam test

      - name: Build the compiler it drives
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build cmake
          cmake -S . -B build -G Ninja -DETHER_BUILD_TESTS=OFF
          cmake --build build
        env:
          CXX: g++-14
          CC: gcc-14

      - name: Build the language server
        run: sh ./lsp/build.sh

      # `scheduling` is left out: it asserts on timings, which a shared runner
      # cannot be relied on to meet. It is the suite to run locally.
      - name: Integration-test the language server
        run: python3 lsp/test/run.py features resilience
